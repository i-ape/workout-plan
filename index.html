<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div class="container mx-auto max-w-lg p-6">
        <h1 class="text-4xl font-bold text-center mb-10 text-white">🏋️ Workout Tracker</h1>

        <!-- Current Workout -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-6">Today's Workout</h2>
            <div id="current-workout" class="mb-6"></div>
            
            <div class="space-y-4">
                <input type="text" id="exercise-name" 
                       class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg" 
                       placeholder="Exercise name (e.g. Bench Press)" />

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-1">Reps</label>
                        <input type="number" id="reps" value="8" min="1"
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                    <div>
                        <label class="block text-sm text-zinc-400 mb-1">Weight (kg)</label>
                        <input type="number" id="weight" value="80" step="0.5" min="0"
                               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                </div>

                <button id="log-btn" 
                        class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl text-xl font-semibold transition">
                    Log Set
                </button>
            </div>
        </div>

        <!-- History -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">History</h2>
            <button id="load-history" 
                    class="mb-4 px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl">
                Load History
            </button>
            <div id="history-list" class="space-y-3"></div>
        </div>

        <p id="status" class="text-center mt-6 font-medium"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
