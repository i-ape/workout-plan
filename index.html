<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>   <!-- Temporary for faster testing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
</head>
<body>
    <div class="container">
        <h1>🏋️ Workout Tracker</h1>

        <!-- Current Workout -->
        <div class="section">
            <h2>Current Workout</h2>
            <div class="form-group">
                <label>Exercise Name</label>
                <input type="text" id="exercise-name" placeholder="e.g. Squat, Bench Press" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Reps</label>
                    <input type="number" id="reps" value="8" min="1" />
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" value="80" step="0.5" min="0" />
                </div>
            </div>

            <button id="log-btn">Log Set</button>
        </div>

        <!-- History -->
        <div class="section">
            <h2>History</h2>
            <button id="load-history">Load History</button>
            <div id="history-list"></div>
        </div>

        <p id="status"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
