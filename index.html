<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
</head>
<body>
    <div class="container">
        <h1>🏋️ Workout Tracker</h1>
        
        <div class="section">
            <h2>Quick Log Set</h2>
            
            <div class="form-group">
                <label>Exercise Name</label>
                <input type="text" id="exercise-name" placeholder="e.g. Bench Press" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Reps</label>
                    <input type="number" id="reps" value="8" />
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" value="80" step="0.5" />
                </div>
            </div>

            <button id="log-btn">Log Set</button>
        </div>

        <div class="section">
            <h2>Exercises</h2>
            <button id="load-exercises">Load Exercises</button>
            <ul id="exercise-list"></ul>
        </div>

        <p id="status"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
