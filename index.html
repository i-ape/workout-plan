<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-lg mx-auto p-6">
        <h1 class="text-4xl font-bold text-center mb-4">🏋️ Workout Tracker</h1>
        <div id="lifetime-stats" class="flex justify-center gap-6 text-center mb-8 text-sm text-zinc-400"></div>

        <div class="text-center mb-6">
            <button id="export-csv-btn" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl">
                Export to CSV
            </button>
        </div>
        <!-- Backup & Restore -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Backup & Restore</h2>
            <button id="create-backup-btn"
                    class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition mb-4">
                Create Backup
            </button>
            <div id="backup-list" class="space-y-2 text-sm"></div>
        </div>

        <!-- Current Workout -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-6">Today's Workout</h2>
            <div id="current-workout" class="mb-8 text-zinc-300"></div>
            <!-- Log Set Form -->
            <div class="space-y-5">
                <input 
                    type="text" 
                    id="exercise-name" 
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg"
                    placeholder="Exercise name (e.g. Bench Press)" />
                <select id="exercise-category"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg">
                    <option value="Chest">Chest</option>
                    <option value="Back">Back</option>
                    <option value="Legs">Legs</option>
                    <option value="Shoulders">Shoulders</option>
                    <option value="Arms">Arms</option>
                    <option value="Core">Core</option>
                    <option value="Cardio">Cardio</option>
                    <option value="Other" selected>Other</option>
                </select>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Reps</label>
                        <input 
                            type="number" 
                            id="reps" 
                            value="8" 
                            min="1"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Weight (kg)</label>
                        <input 
                            type="number" 
                            id="weight" 
                            value="80" 
                            step="0.5" 
                            min="0"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-zinc-400 mb-2">RPE (optional)</label>
                    <input 
                        type="number" 
                        id="rpe" 
                        step="0.5" 
                        min="1" 
                        max="10"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg"
                        placeholder="e.g. 8.5" />
                </div>
                <input 
                    type="text" 
                    id="exercise-notes" 
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg"
                    placeholder="Notes (optional)" />
                <button id="log-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl text-xl font-semibold transition">
                    Log Set
                </button>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Rest (seconds)</label>
                        <input 
                            type="number" 
                            id="rest-duration" 
                            value="90" 
                            min="5"
                            step="5"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg" />
                    </div>
                    <div class="flex items-end">
                        <button id="rest-btn"
                                class="w-full bg-orange-600 hover:bg-orange-500 py-4 rounded-2xl text-lg font-semibold transition">
                            Start Rest Timer
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Body Part Focus -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Body Part Focus</h2>
            <div id="category-focus"></div>
        </div>

        <!-- Routines -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Routines</h2>
            <div class="flex gap-2 mb-4">
                <select id="routine-select"
                        class="flex-1 bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg">
                    <option value="">Select a routine...</option>
                </select>
                <button id="edit-routine-btn"
                        class="px-4 bg-zinc-700 hover:bg-zinc-600 rounded-2xl text-sm font-semibold transition">
                    Edit
                </button>
                <button id="delete-routine-btn"
                        class="px-4 bg-red-800 hover:bg-red-700 rounded-2xl text-sm font-semibold transition">
                    Delete
                </button>
            </div>
            <div id="routine-preview" class="text-sm text-zinc-400 mb-4"></div>

            <div class="border-t border-zinc-800 pt-4 mt-4">
                <p id="routine-form-label" class="text-sm text-zinc-400 mb-2">Create new routine</p>
                <input 
                    type="text" 
                    id="new-routine-name" 
                    placeholder="Routine name (e.g. Push Day)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mb-3" />
                <input 
                    type="text" 
                    id="new-routine-exercises" 
                    placeholder="Exercises, comma-separated (e.g. Bench Press, OHP, Triceps)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mb-3" />
                <button id="save-routine-btn"
                        class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition">
                    Save Routine
                </button>
            </div>
        </div>
        <div class="border-t border-zinc-800 pt-4 mt-4">
    <p id="routine-form-label" class="text-sm text-zinc-400 mb-2">Create new routine</p>
    <input 
        type="text" 
        id="new-routine-name" 
        placeholder="Routine name (e.g. Push Day)"
        class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mb-3" />
    <input 
        type="text" 
        id="new-routine-exercises" 
        placeholder="Exercises, comma-separated (e.g. Bench Press, OHP, Triceps)"
        class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mb-3" />
    <div class="flex gap-2">
        <button id="save-routine-btn"
                class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition">
            Save Routine
        </button>
        <button id="cancel-routine-edit-btn"
                class="hidden px-6 bg-zinc-700 hover:bg-zinc-600 rounded-2xl text-lg font-semibold transition">
            Cancel
        </button>
    </div>
</div>

        <!-- 1RM Calculator -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">1RM Calculator</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input 
                    type="number" 
                    id="calc-weight" 
                    placeholder="Weight (kg)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg" />
                <input 
                    type="number" 
                    id="calc-reps" 
                    placeholder="Reps"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg" />
            </div>
            <button id="calc-1rm-btn"
                    class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition mb-4">
                Calculate 1RM
            </button>
            <div id="calc-1rm-result" class="text-zinc-300"></div>
        </div>

        <!-- Warm-up Generator -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Warm-up Sets</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input 
                    type="number" 
                    id="warmup-target" 
                    placeholder="Working weight (kg)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg" />
                <input 
                    type="number" 
                    id="warmup-bar" 
                    value="20"
                    placeholder="Bar weight (kg)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-lg" />
            </div>
            <button id="warmup-btn"
                    class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition mb-4">
                Generate Warm-up
            </button>
            <div id="warmup-result" class="text-zinc-300"></div>
        </div>

        <!-- Exercise Progress -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Exercise Progress</h2>
            <select id="progress-exercise-select"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg mb-4">
                <option value="">Select an exercise...</option>
            </select>
            <div id="exercise-progress-list"></div>
        </div>

        <!-- RPE Weight Suggestor -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Suggested Weight</h2>
            <div class="grid grid-cols-3 gap-3 mb-4">
                <input 
                    type="number" 
                    id="suggest-1rm" 
                    placeholder="1RM (kg)"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3 py-4 text-center text-lg" />
                <input 
                    type="number" 
                    id="suggest-reps" 
                    placeholder="Reps"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3 py-4 text-center text-lg" />
                <input 
                    type="number" 
                    id="suggest-rpe" 
                    step="0.5" 
                    placeholder="RPE"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-3 py-4 text-center text-lg" />
            </div>
            <button id="suggest-weight-btn"
                    class="w-full bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl text-lg font-semibold transition mb-4">
                Suggest Weight
            </button>
            <div id="suggest-result" class="text-zinc-300"></div>
        </div>

        <!-- Weekly Trend -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Volume Trend</h2>
            <div id="weekly-trend" class="text-zinc-300"></div>
        </div>

        <!-- Personal Records -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Personal Records</h2>
            <button id="load-prs"
                    class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl mb-4">
                Load Personal Records
            </button>
            <div id="pr-list" class="space-y-3 text-zinc-300"></div>
        </div>

        <!-- Calendar -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">Calendar</h2>
            <div class="flex items-center justify-between mb-4">
                <button id="prev-month" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">←</button>
                <span id="cal-month-label" class="font-semibold text-lg"></span>
                <button id="next-month" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">→</button>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
            <div id="calendar-day-detail" class="mt-4 text-zinc-300"></div>
        </div>

        <!-- History -->
<div class="section">
    <h2 class="text-2xl font-semibold mb-4">History</h2>
    <div class="flex gap-2 mb-4">
        <button id="load-history"
                class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl">
            Load History
        </button>
        <input 
            type="text" 
            id="history-filter" 
            placeholder="Filter by exercise name..."
            class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm" />
    </div>
    <div id="history-list" class="space-y-3"></div>
</div>
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">History</h2>
            <button id="load-history"
                    class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl mb-4">
                Load History
            </button>
            <div id="history-list" class="space-y-3"></div>
        </div>

        <p id="status" class="text-center mt-8 font-medium min-h-[28px]"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
