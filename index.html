<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-lg mx-auto p-6">
        <h1 class="text-4xl font-bold text-center mb-10">🏋️ Workout Tracker</h1>

        <!-- Current Workout -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-6">Today's Workout</h2>
            <div id="current-workout" class="mb-8 text-zinc-300"></div>

            <!-- Log Set Form -->
            <div class="space-y-5">
                <input 
                    type="text" 
                    id="exercise-name" 
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-lg"
                    placeholder="Exercise name (e.g. Bench Press)" />

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Reps</label>
                        <input 
                            type="number" 
                            id="reps" 
                            value="8" 
                            min="1"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Weight (kg)</label>
                        <input 
                            type="number" 
                            id="weight" 
                            value="80" 
                            step="0.5" 
                            min="0"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-center text-xl" />
                    </div>
                </div>

                <button id="log-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-2xl text-xl font-semibold transition">
                    Log Set
                </button>

                <button id="rest-btn"
                        class="w-full bg-orange-600 hover:bg-orange-500 py-5 rounded-2xl text-lg font-semibold transition">
                    Start Rest Timer (90s)
                </button>
            </div>
        </div>

        <!-- History -->
        <div class="section">
            <h2 class="text-2xl font-semibold mb-4">History</h2>
            <button id="load-history"
                    class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-xl mb-4">
                Load History
            </button>
            <div id="history-list" class="space-y-3"></div>
        </div>

        <p id="status" class="text-center mt-8 font-medium min-h-[28px]"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
